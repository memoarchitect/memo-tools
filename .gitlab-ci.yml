stages:
  - test
  - docs

variables:
  GIT_SUBMODULE_STRATEGY: recursive

test:
  stage: test
  image: node:26
  before_script:
    - corepack enable
  script:
    - pnpm install --frozen-lockfile
    - pnpm run version:check
    - pnpm run build
    - pnpm run type-check
    - pnpm run test
    # The session-1 regression oracle: the frozen semantic output of the four
    # reference projects. A difference here is a behaviour change, and it fails
    # the build rather than waiting for someone to run the script by hand.
    - pnpm run check:baselines
    # Design section 13.3 makes restart cost a requirement, so its ceilings are
    # measured on GPCA and gated (section 18.4 deliverable 9: a gate, not a
    # report).
    - pnpm run check:budgets
    # The shipped corpus must stay at the native fixed point: a conversion pass
    # over it finds nothing to do.
    - pnpm run check:corpus

pages:
  stage: docs
  image: python:3.12-slim
  script:
    - pip install --quiet "mkdocs==1.6.1" "mkdocs-material==9.7.6" "pymdown-extensions==10.21.3"
    - python -m mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
