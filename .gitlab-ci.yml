stages:
  - test
  - docs

# GitLab runs OpenSysML only. SysIDE needs a licence this runner does not have, so nothing here may call
# `pnpm run test` (its first steps include the SysIDE gate) or leave the compiler to the default.
#
# Without OPENSYSML_BINARY the tests that compile SysML are SKIPPED, not failed, so a job that did not set it
# would read as green while checking nothing. `pnpm install` puts the pinned `sysml-grpc` for this platform
# beside the client; the job finds it and fails if it is not there.
variables:
  GIT_SUBMODULE_STRATEGY: recursive
  MEMO_TOOLCHAIN_COMPILER: opensysml
  MEMO_TEST_COMPILER: opensysml

test:
  stage: test
  image: node:26
  before_script:
    - corepack enable
  script:
    - pnpm install --frozen-lockfile
    - pnpm run version:check
    - pnpm run build
    - pnpm run type-check
    - export OPENSYSML_BINARY="$(find "$PWD/node_modules/.pnpm" -path '*opensysml-sysml-grpc-linux-*/bin/sysml-grpc' | head -1)"
    - test -x "$OPENSYSML_BINARY" || { echo "sysml-grpc for this platform was not installed"; exit 1; }
    - node scripts/check-config-boundary.mjs
    - cd packages/tools && pnpm exec vitest run && cd ../..
    # The session-1 regression oracle: the frozen semantic output of the four reference projects. A difference
    # here is a behaviour change, and it fails the build rather than waiting for someone to run it by hand.
    - pnpm run check:baselines
    # Not run here: `check:budgets` imports a module deleted with the Langium compiler, and `check:corpus`
    # fails on examples/sysml-diagram-samples. Both are on the board (KANBAN.md), not skipped silently.

pages:
  stage: docs
  image: python:3.12-slim
  script:
    - pip install --quiet "mkdocs==1.6.1" "mkdocs-material==9.7.6" "pymdown-extensions==10.21.3"
    - python -m mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
