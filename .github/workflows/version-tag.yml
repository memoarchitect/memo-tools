name: Version source and tag

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/sync-version.mjs --check
      - name: Tag a changed VERSION
        if: github.ref == 'refs/heads/main'
        run: scripts/tag-version-on-change.sh "${{ github.event.before }}"
