[project]
name = "memo-tools-docs"
version = "0.15.2"
description = "Documentation for MEMO Tools"
requires-python = ">=3.10"
dependencies = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "pymdown-extensions>=10.0",
]

# `python -m` is load-bearing where mkdocs.yml resolves a fence through a module
# at the repo root (`sysml_highlight.sysml_fence_format`): only `python -m` puts
# the working directory on sys.path, and a bare `mkdocs build` therefore dies in
# CONFIG PARSING with "No module named sysml_highlight". Spelled the same way in
# all three docs repos whether or not this one has such a module today. The full
# reasoning lives once, in memo-meta's AGENTS.md.
[tool.pdm.scripts]
docs-serve = "python -m mkdocs serve"
docs-build = "python -m mkdocs build --strict"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
