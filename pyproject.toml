[project]
name = "memo-tools-docs"
version = "0.13.2"
description = "Documentation for MEMO Tools"
requires-python = ">=3.10"
dependencies = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "pymdown-extensions>=10.0",
]

# `python -m` puts the working directory on sys.path, which mkdocs.yml needs
# wherever a fence resolves a module at the repo root. memo-tools has no such
# module today, so a bare `mkdocs` would work here — this stays uniform with
# memo and memo-architect, where it is the difference between building and
# failing in config parsing.
[tool.pdm.scripts]
docs-serve = "python -m mkdocs serve"
docs-build = "python -m mkdocs build --strict"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
